# TEMPORARY: verifies the IL ICC open-only-search fix against live
# responses. Remove after the investigation.
name: probe-il-nc
on:
  push:
    branches: [claude/sweet-turing-7e14zm]
    paths: [.github/workflows/probe-il-nc.yml, src/lib/ingest/ilIccDockets.ts]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund && npx prisma generate
      - name: verify
        run: |
          cat > verify.ts <<'TS'
          import { parseSearchResults } from "@/lib/ingest/ilIccDockets";
          const base = "https://icc.illinois.gov/docket/search/cases/results?ct=5|4,5|5&st=7,18&o=";
          const get = async (u: string) => { const r = await fetch(u); if (!r.ok) throw new Error(`${r.status} ${u}`); return r.text(); };
          (async () => {
            const all = parseSearchResults(await get(base + "False"));
            const open = parseSearchResults(await get(base + "True"));
            const allIds = new Set(all.map((r) => r.docketId));
            const openIds = new Set(open.map((r) => r.docketId));
            const cpcn = all.filter((c) => /certificate\s+of\s+public\s+convenience\s+and\s+necessity/i.test(c.description) && !/declaratory/i.test(c.description));
            console.log(`all=${all.length} open=${open.length} stray=${open.filter((r) => !allIds.has(r.docketId)).length} cpcn=${cpcn.length}`);
            console.log("open rows:", JSON.stringify(open, null, 1));
            console.log("cpcn still open:", cpcn.filter((c) => openIds.has(c.docketId)).map((c) => c.docketId));
            console.log("P2023-0658 open?", openIds.has("P2023-0658"), " in all?", allIds.has("P2023-0658"));
          })().catch((e) => { console.error(e); process.exit(1); });
          TS
          PRISMA_ACCELERATE_URL="postgresql://unused:unused@localhost:5432/unused" DATABASE_URL="postgresql://unused:unused@localhost:5432/unused" npx tsx --tsconfig tsconfig.json verify.ts
