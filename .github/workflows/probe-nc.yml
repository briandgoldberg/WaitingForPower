# TEMPORARY: dumps the ungated NCUC hearings page tables. Remove after the investigation.
name: probe-nc
on:
  push:
    branches: [claude/sweet-turing-7e14zm]
    paths: [.github/workflows/probe-nc.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36'
          curl -sL -o f -A "$UA" -H 'Accept-Language: en-US,en;q=0.9' --max-time 60 https://www.ncuc.gov/Hearings/hearings.html
          wc -c f
          python3 - <<'PY'
          import re,html
          s=open('f',encoding='utf-8',errors='replace').read()
          s=re.sub(r'<!--.*?-->','',s,flags=re.S)
          i=s.find('Select Proceedings with Hearings Scheduled')
          s=s[i:]
          s=re.sub(r'<(tr|br|p|li)[^>]*>','\n',s,flags=re.I)
          s=re.sub(r'</td>',' | ',s,flags=re.I)
          s=html.unescape(re.sub(r'<[^>]+>',' ',s))
          s=re.sub(r'[ \t\r]+',' ',s)
          s=re.sub(r'\n\s*\n+','\n',s)
          print(s[:30000])
          PY
