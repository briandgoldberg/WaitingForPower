# TEMPORARY: hand-research source dump (NCUC hearings page, IUC Summit page). Remove after.
name: probe-nc
on:
  push:
    branches: [claude/sweet-turing-7e14zm]
    paths: [.github/workflows/probe-nc.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36'
          curl -sL -o nc.html -A "$UA" --max-time 60 https://www.ncuc.gov/Hearings/hearings.html
          curl -sL -o ia.html -A "$UA" --max-time 60 https://iuc.iowa.gov/hazardous-liquid-pipeline-requests
          python3 - <<'PY'
          import re,html
          def text(s):
              s=re.sub(r'<!--.*?-->','',s,flags=re.S)
              s=re.sub(r'<(script|style)[^>]*>.*?</\1>','',s,flags=re.S|re.I)
              s=re.sub(r'<(tr|br|p|li|h\d)[^>]*>','\n',s,flags=re.I)
              s=re.sub(r'</td>',' | ',s,flags=re.I)
              s=html.unescape(re.sub(r'<[^>]+>',' ',s))
              s=re.sub(r'[ \t\r]+',' ',s); return re.sub(r'\n\s*\n+','\n',s)
          nc=text(open('nc.html',errors='replace').read())
          lines=nc.split('\n')
          # section headers + electric certificate rows (row text spans lines until next '|' row)
          sec=None; buf=''
          for ln in lines:
              if re.search(r'Hearings Scheduled|Awaiting Decision|Final Orders|Archived Orders|^\s*20\d\d\s*$',ln): print('## '+ln.strip()); continue
              if re.search(r'Certificate of (Public Convenience|Environmental Compat)|CPCN|Solar|Megawatt|MW|kV|Transmission|Generating',ln,re.I) and not re.search(r'Water|Sewer|Wastewater|Moving|Transp\.',ln,re.I):
                  i=lines.index(ln); print('  '+' '.join(l.strip() for l in lines[i:i+6])[:400])
          # hearings table raw rows
          i=nc.find('Select Proceedings with Hearings Scheduled'); j=nc.find('Proceedings Awaiting Decision')
          print('\n######## HEARINGS TABLE\n'+nc[i:j][:12000])
          ia=text(open('ia.html',errors='replace').read())
          k=ia.find('Summit'); print('\n######## IUC\n'+ia[max(0,k-200):k+9000])
          PY
